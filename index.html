
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WIDDX Visual Development Environment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              charcoal: '#121212',
              panel: '#18181b',
              purple: {
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'gradient-x': 'gradient-x 3s ease infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center',
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center',
                },
              },
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
      body { 
        margin: 0; 
        font-family: 'Inter', 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        background-color: #121212; /* Charcoal Black */
        color: #f4f4f5; 
        -webkit-font-smoothing: antialiased;
      }
      
      [dir="rtl"] { font-family: 'Tajawal', 'Inter', sans-serif; }

      /* --- GLOBAL STYLES (Charcoal Identity) --- */
      :root {
        --bg-dark: #121212;
        --bg-panel: #18181b;
        --border-color: #27272a;
        --accent-primary: #8b5cf6; /* Violet */
      }

      /* Custom Scrollbars - Darker */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #121212;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 5px;
        border: 2px solid #121212;
        background-clip: content-box;
      }
      *:hover::-webkit-scrollbar-thumb {
        background-color: #3f3f46;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .widdx-engineering-bg {
        background-color: #121212;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        background-position: center top;
      }

      .widdx-dots-bg {
        background-color: var(--bg-dark);
        background-image: radial-gradient(#27272a 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Glassmorphism */
      .glass-panel {
        background: rgba(24, 24, 27, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      /* Animations */
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

      /* Mermaid SVG Professional Overrides */
      .mermaid svg {
        max-width: none !important;
        height: auto !important;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
      }
      .mermaid .edgePath path {
        stroke-linecap: round;
        transition: all 0.3s ease;
      }
      /* Valid Flows - Purple */
      .mermaid .edgePath path[style*="#8b5cf6"] {
        stroke-width: 2px !important;
        opacity: 0.6;
        animation: flowPurple 2s linear infinite;
      }
      /* Broken Flows - Red */
      .mermaid .edgePath path[style*="#ef4444"] {
        stroke-width: 2px !important;
        stroke-dasharray: 4,4 !important;
        opacity: 0.8;
        animation: pulseRed 2s ease-in-out infinite;
      }

      @keyframes flowPurple {
        0% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseRed {
        0%, 100% { opacity: 0.5; stroke-width: 2px; }
        50% { opacity: 1; stroke-width: 3px; }
      }
      
      /* Prism Overrides for Editor */
      code[class*="language-"], pre[class*="language-"] {
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 13px !important;
        text-shadow: none !important;
        background: transparent !important;
      }
      
      .text-xxs { font-size: 0.65rem; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "d3": "https://esm.sh/d3@^7.9.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "mermaid": "https://esm.sh/mermaid@11.4.0",
    "diff": "https://esm.sh/diff@5.1.0",
    "@monaco-editor/react": "https://esm.sh/@monaco-editor/react@^4.6.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
